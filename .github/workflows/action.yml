name: build
on:
  - push
  - pull_request

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/action.yml'
            server:
              - 'node-server/**'
              - '.github/workflows/action.yml'
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install frontend dependencies
        working-directory: ./frontend
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN || secrets.FONTAWESOME_NPM_TOKEN }}
        run: bun install --frozen-lockfile
      - name: Typecheck, test, and build frontend
        working-directory: ./frontend
        run: |
          bun run typecheck
          bun run test
          bun run build
      - name: Install E2E browser
        working-directory: ./frontend
        run: bunx playwright install --with-deps chromium
      - name: Run frontend E2E tests
        working-directory: ./frontend
        run: bun run e2e
      - name: Build and smoke-test frontend container
        env:
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN || secrets.FONTAWESOME_NPM_TOKEN }}
        run: |
          docker build \
            --build-arg FONTAWESOME_PACKAGE_TOKEN="$FONTAWESOME_PACKAGE_TOKEN" \
            --tag sprint-planning-poker-frontend \
            ./frontend
          docker run --detach --name sprint-planning-poker-frontend --publish 4210:4200 sprint-planning-poker-frontend
          trap 'docker rm --force sprint-planning-poker-frontend' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:4210/sprint-planning-poker/ \
            --output /tmp/sprint-planning-poker-index.html
          asset_path="$(grep --only-matching --extended-regexp --max-count=1 '/sprint-planning-poker/assets/[^\" ]+\.js' /tmp/sprint-planning-poker-index.html)"
          test -n "$asset_path"
          curl --fail "http://127.0.0.1:4210${asset_path}" --output /dev/null
      - uses: codecov/codecov-action@v5
        with:
          directory: ./frontend
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ./node-server/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ./node-server/pnpm-lock.yaml
      - name: install & test
        working-directory: ./node-server
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - uses: codecov/codecov-action@v5
        with:
          directory: ./node-server
  publish-server:
    needs:
      - changes
      - server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Read package version
        id: version
        run: echo "version=$(jq -r .version node-server/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./node-server
          push: true
          tags: |
            discorev/sprint-planning-poker-server:latest
            discorev/sprint-planning-poker-server:${{ steps.version.outputs.version }}
  publish-frontend:
    needs:
      - changes
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Read package version
        id: version
        run: echo "version=$(jq -r .version frontend/package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            FONTAWESOME_PACKAGE_TOKEN=${{ secrets.FONTAWESOME_PACKAGE_TOKEN || secrets.FONTAWESOME_NPM_TOKEN }}
          tags: |
            discorev/sprint-planning-poker-frontend:latest
            discorev/sprint-planning-poker-frontend:${{ steps.version.outputs.version }}
